.beacon:after {

}
#debug {

  right: 18%;
  top: calc(var(--top) + 8px);
  font: 10px var(--mono);
  color: #e0b773;
}
#veil {
  position: absolute;
  inset: 0;
  background: #090b09;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  color: #cfac75;
  letter-spacing: 0.16em;
  font: 14px var(--mono);
  z-index: 20;
  pointer-events: none;
}
#veil:before {
  content: '';
  width: 33px;
  height: 1px;
  background: var(--amber);
}
.entered #veil {
  animation: veil-out 0.7s both;
}
.instant #veil {
  display: none;
}
.entered:not(.instant) .reveal {
  animation: slide-in 0.75s both;
  animation-delay: var(--delay, 0.12s);
}
@keyframes veil-out {
  0%,
  18% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    visibility: hidden;
  }
}
@keyframes slide-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
[hidden] {
  display: none !important;
}
